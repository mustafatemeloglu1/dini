function texts(){return `<div>${hero('sacred','Kutsal Metinler','Her kutsal metin Kur’an gibi kendi okuyucusuna sahip.')}<div class="screen"><div class="notice"><b>Metin kitaplığı</b><br>Bir metne dokunduğunda doğrudan onun ayrı okuyucu ekranına geçersin.</div><div class="section-title"><h2>Bağımsız okuyucular</h2><small>${sacredReaderDefs.length} metin</small></div><div class="feature-grid">${sacredReaderDefs.map((t,i)=>`<button type="button" class="feature" data-action="select-sacred" data-index="${i}" style="background-image:url('${imageFor(t.img,i+2)[1]}');cursor:pointer"><div class="eyebrow2">TAM METİN OKUYUCU</div><h3>${esc(t.name)}</h3><p class="small">${esc(t.trad)}</p><p class="small" style="margin-top:6px">${esc(t.note)}</p><span class="source-pill">Okumaya başla ›</span></button>`).join('')}</div><div class="section-title"><h2>Çarpıcı pasajlar</h2><small>metinlerden seçkiler</small></div><div class="quote-grid">${sacred.slice(0,8).map((t,i)=>`<button type="button" class="quote-card" data-action="select-sacred" data-index="${sacredSelectionIndexByName(t.name)}" style="background-image:url('${imageFor(t.img||'sacred',i+5)[0]}');cursor:pointer"><div class="type">${esc(t.trad||'Gelenek')}</div><div class="q">${esc(t.quote||'')}</div><small>${esc(t.name||'')}</small></button>`).join('')}</div></div>${nav()}</div>`} 
function sacredSelectionIndexByName(name){const i=sacredReaderDefs.findIndex(x=>x.name===name);return i>=0?i:0}

function chapterOptions(d){const max=d?.type==='turkish-bible'?(state.sacredBibleBooks?.[state.sacredBookIndex]?.[2]||bibleBookCatalog[state.sacredBookIndex]?.[2]||1):(d?.type==='sefaria'?(d.books?.[state.sacredBookIndex]?.[2]||50):(d?.chapterCount||26));return Array.from({length:max},(_,i)=>`<option value="${i+1}" ${state.sacredChapter===i+1?'selected':''}>Bölüm ${i+1}</option>`).join('')}
function sacredBookOptions(d){const books=d?.type==='turkish-bible'?(state.sacredBibleBooks?.length?state.sacredBibleBooks:bibleBookCatalog):(d?.books||[]);return books.map((b,i)=>`<option value="${i}" ${state.sacredBookIndex===i?'selected':''}>${esc(b[1]||b.name||b[0])}</option>`).join('')}
function sacredReaderPage(){const d=sacredReaderDefs[state.sacredIndex]||sacredReaderDefs[0];const books=d.type==='turkish-bible'?(state.sacredBibleBooks?.length?state.sacredBibleBooks:bibleBookCatalog):(d.books||[]);const showBook=books.length>1||d.type==='turkish-bible';const max=d.type==='turkish-bible'?(books[state.sacredBookIndex]?.[2]||1):(d.type==='sefaria'?(books[state.sacredBookIndex]?.[2]||50):(d.chapterCount||26));state.sacredChapter=Math.max(1,Math.min(max,Number(state.sacredChapter)||1));return `<div>${hero(d.img,d.name,d.trad)}<div class="screen"><div class="reader-head"><div class="reader-nav"><div class="select-wrap" style="display:flex;gap:8px;flex:1;flex-wrap:wrap">${showBook?`<select class="select" id="sacredBookSelect">${sacredBookOptions(d)}</select>`:''}<select class="select" id="sacredChapterSelect">${chapterOptions(d)}</select></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" data-action="prev-sacred">‹ Önceki</button><button class="btn gold" data-action="random-sacred">Rastgele</button><button class="btn gold" data-action="reload-sacred">Yenile ↻</button><button class="btn" data-action="next-sacred">Sonraki ›</button></div></div><div class="tagrow"><span class="source-pill">${esc(d.trad)}</span><span class="source-pill">Uygulama içi okuma</span><span class="source-pill">Çevrimiçi + önbellek</span></div></div><div id="sacredReader" class="reading"><div class="loading">Metin yükleniyor…</div></div></div>${nav()}</div>`}
function refreshSacredSelectors(){const d=sacredReaderDefs[state.sacredIndex];const bs=document.getElementById('sacredBookSelect'),cs=document.getElementById('sacredChapterSelect');if(bs)bs.innerHTML=sacredBookOptions(d);if(cs)cs.innerHTML=chapterOptions(d)}
async function loadSacredReader(){const d=sacredReaderDefs[state.sacredIndex];const box=document.getElementById('sacredReader');if(!box||!d)return;const token=++state.sacredLoadToken;box.innerHTML='<div class="loading">Metin yükleniyor…</div>';try{let html='';if(d.type==='sefaria')html=await loadSefaria(d);else if(d.type==='turkish-bible')html=await loadTurkishBible(d);else if(d.type==='gita')html=await loadGita(d);else if(d.type==='dhammapada')html=await loadDhammapada(d);if(token!==state.sacredLoadToken)return;box.innerHTML=html||'<div class="loading">Bu bölümde gösterilecek metin bulunamadı.</div>';}catch(e){if(token!==state.sacredLoadToken)return;box.innerHTML=`<div class="notice"><b>Çevrimiçi metin şu an alınamadı.</b><br>Yenile ile tekrar deneyebilirsin. Daha önce önbelleğe alınmış veri varsa onu kullanır.<br><small>${esc(e?.message||'Ağ hatası')}</small></div>`}}
async function loadSefaria(d){const meta=d.books?.[state.sacredBookIndex]||d.books?.[0];const book=meta?.[0];const max=meta?.[2]||50;state.sacredChapter=Math.max(1,Math.min(max,Number(state.sacredChapter)||1));const ref=`${book} ${state.sacredChapter}`;const r=await fetch(`https://www.sefaria.org/api/v3/texts/${encodeURIComponent(ref)}?return_format=text_only`);if(!r.ok)throw new Error('Sefaria erişimi başarısız');const j=await r.json();const versions=j.versions||[];const he=versions.find(v=>v.language==='hebrew')||versions.find(v=>v.language==='he')||versions[0];const ev=versions.find(v=>v.language==='english')||versions.find(v=>v.language==='en');const arr=Array.isArray(he?.text)?he.text:(Array.isArray(ev?.text)?ev.text:[]);const en=Array.isArray(ev?.text)?ev.text:[];let html=`<div class="reader-banner"><b>${esc(meta?.[1]||book)} • Bölüm ${state.sacredChapter}</b><span>Orijinal + İngilizce sürüm • Sefaria</span></div>`;const n=Math.max(arr.length,en.length);for(let i=0;i<n;i++)html+=`<div class="v"><div class="num">${esc(meta?.[1]||book)} ${state.sacredChapter}:${i+1}</div>${arr[i]?`<div class="ori">${esc(stripHtml(arr[i]))}</div>`:''}${en[i]?`<div class="trans">${esc(stripHtml(en[i]))}</div>`:''}<div class="src">Sefaria • ${esc(book)} ${state.sacredChapter}:${i+1}</div></div>`;return html}
function stripHtml(s){return String(s||'').replace(/<[^>]*>/g,'')}
async function loadTurkishBible(d){
if(!state.bibleXml){
 const r=await fetch('https://raw.githubusercontent.com/seven1m/open-bibles/master/tur-turkish.osis.xml');
 if(!r.ok)throw new Error('Türkçe İncil verisi alınamadı');
 state.bibleXml=await r.text();
 localStorage.setItem('dinios-bible-cache',state.bibleXml);
}
const xml=new DOMParser().parseFromString(state.bibleXml,'application/xml');
const allBooks=[...xml.querySelectorAll('div[type="book"]')];
const ntKeys=new Set(bibleBookCatalog.map(x=>x[0]));
const books=allBooks.filter(b=>{const raw=b.getAttribute('osisID')||b.getAttribute('id')||'';return ntKeys.has(raw.split(/[.]/)[0])});
state.sacredBibleBooks=books.map((b,i)=>{
 const raw=b.getAttribute('osisID')||b.getAttribute('id')||String(i+1);
 const key=raw.split(/[.]/)[0];
 const chapters=[...b.children].filter(x=>x.tagName==='chapter');
 return [raw,bibleNameMap[key]||b.getAttribute('n')||key||('Kitap '+(i+1)),chapters.length]
}).filter(x=>x[2]);
if(!state.sacredBibleBooks.length)state.sacredBibleBooks=bibleBookCatalog;
state.sacredBookIndex=Math.max(0,Math.min(state.sacredBibleBooks.length-1,state.sacredBookIndex));
refreshSacredSelectors();
const book=books[state.sacredBookIndex]||books[0];
const meta=state.sacredBibleBooks[state.sacredBookIndex]||bibleBookCatalog[state.sacredBookIndex]||[];
const chapterNodes=[...book.children].filter(x=>x.tagName==='chapter');
if(!chapterNodes.length)throw new Error('Bu kitapta bölüm verisi bulunamadı');
state.sacredChapter=Math.max(1,Math.min(chapterNodes.length,Number(state.sacredChapter)||1));
const ch=chapterNodes[state.sacredChapter-1]||chapterNodes[0];
let outHtml=`<div class="reader-banner"><b>${esc(meta[1]||'İncil')} • Bölüm ${state.sacredChapter}</b><span>Türkçe metin • uygulama içi okuma</span></div>`;
[...(ch?.querySelectorAll('verse')||[])].forEach((v,j)=>{
 const num=v.getAttribute('osisID')||(`${state.sacredChapter}:${j+1}`);
 outHtml+=`<div class="v"><div class="num">${esc(num)}</div><div class="trans">${esc(stripHtml(v.textContent||''))}</div><div class="src">Türkçe İncil • ${esc(meta[1]||'')} ${state.sacredChapter}:${j+1}</div></div>`;
});
return outHtml;
}

function render(){const el=document.getElementById('app');let html='';switch(state.page){case'home':html=home();break;case'quran':html=quran();break;case'hadith':html=hadith();break;case'scholars':html=people('scholars');break;case'philosophers':html=people('philosophers');break;case'texts':case'sacred':html=texts();break;case'discover':html=discover();break;case'current':html=current();break;case'library':html=library();break;case'sacredReader':html=sacredReaderPage();break;default:html=home()}el.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});if(state.page==='sacredReader')loadSacredReader();if(state.page==='discover'&&state.q)updateDiscoverResults(state.q)}
function setBusy(v){state.busy=v;document.querySelectorAll('.refresh').forEach(b=>{if(v&&b.dataset.action?.startsWith('refresh'))b.disabled=true;b.classList.toggle('spin',v)})}
async function refreshAll(){setBusy(true);try{const ref=refs[Math.floor(Math.random()*refs.length)][0];const r=await fetch(`https://api.alquran.cloud/v1/ayah/${ref}/tr.diyanet`);if(r.ok){const j=await r.json();if(j.status==='OK'){const d=j.data;state.live.quran={id:ref,surah:d.surah?.name||localAyahs.find(x=>x.id===ref)?.surah||'',ayah:d.numberInSurah,arab:localAyahs.find(x=>x.id===ref)?.arab||'',tr:d.text}}}}catch(e){}try{await loadOnlineHadith(false)}catch(e){}setBusy(false);render()}
async function loadOnlineHadith(showToast=true,edition=state.hadithEdition||'tur-bukhari'){if(state.hadithLoading)return;state.hadithLoading=true;try{state.hadithEdition=edition;const r=await fetch(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/${edition}.json`);if(!r.ok)throw new Error('hadith');const j=await r.json();const arr=j.hadiths||j.data||[];if(!arr.length)throw new Error('empty');state.hadithPool=arr;const size=18;const maxStart=Math.max(0,arr.length-size);const start=Math.floor(Math.random()*(maxStart+1));const picks=[];for(let i=start;i<Math.min(start+size,arr.length);i++){const h=arr[i];picks.push({book:`${edition.replace('tur-','')} • Hadis ${h.hadithnumber||i+1}`,title:`Hadis ${h.hadithnumber||i+1}`,text:h.text||'',grade:'Kaynaktan alındı',tag:edition.replace('tur-','').toUpperCase(),img:['hadith','manuscript','library','rain','journey'][i%5],full:true})}hadithLocal.splice(0,hadithLocal.length,...picks);state.live.hadith=picks[0];localStorage.setItem('dinios-hadith-cache',JSON.stringify(picks));if(showToast)toast('Yeni hadis akışı yüklendi')}catch(e){try{const cached=JSON.parse(localStorage.getItem('dinios-hadith-cache')||'[]');if(cached.length)hadithLocal.splice(0,hadithLocal.length,...cached)}catch(_){ }if(showToast)toast('Çevrimiçi hadis alınamadı; önbellek kullanılıyor')}finally{state.hadithLoading=false}}
function openGlobalSearch(term){state.q=term.trim();state.topic=null;state.page='discover';render();updateDiscoverResults(state.q)}
function doPeopleFilter(term){const q=norm(term);document.querySelectorAll('.person-item').forEach(btn=>{btn.style.display=!q||norm(btn.innerText).includes(q)?'flex':'none'})}

function updateQuranSearch(term){const box=document.getElementById('quranSearchResults');if(!box)return;const q=norm(term).trim();if(!q){box.innerHTML='';return}const hits=[];SURAH_NAMES.forEach((s,i)=>{if(norm(s[0]).includes(q))hits.push(`<button class="search-hit" data-surah="${i+1}"><b>${i+1}. ${esc(s[0])}</b><span>${s[1]} ayet • ${s[2]}</span></button>`)});localAyahs.filter(a=>norm([a.surah,a.tr].join(' ')).includes(q)).forEach(a=>hits.push(`<button class="search-hit" data-action="open-ayah" data-id="${esc(a.id)}"><b>AYET • ${esc(a.surah)} ${a.ayah}</b><span>${esc(a.tr)}</span></button>`));box.innerHTML=hits.slice(0,12).join('')||'<div class="empty">Sonuç bulunamadı.</div>'}
document.addEventListener('click',(e)=>{
 const target=e.target instanceof Element?e.target:null; if(!target)return;
 // Tek bir merkezî tıklama sistemi: görsel katmanlar pointer-events:none, bütün butonlar buradan yönetilir.
 const route=target.closest('[data-route]');
 if(route){e.preventDefault();e.stopPropagation();const p=route.dataset.route;if(p){state.page=p;state.topic=null;state.q='';render();}return;}
 const act=target.closest('[data-action]');
 if(act){e.preventDefault();e.stopPropagation();const a=act.dataset.action;
  switch(a){
   case 'open-discover': state.page='discover';state.topic=null;state.q='';render();break;
   case 'open-topic': {const topic=act.dataset.topic||''; if(topicData[topic]){state.page='discover';state.topic=topic;state.q='';render();} else toast('Konu bulunamadı');break;}
   case 'close-modal':closeModal();break;
   case 'save':toggleSave(act.dataset.id);break;
   case 'open-ayah':openAyah(act.dataset.id);break;
   case 'open-hadith':openHadith(act.dataset.index);break;
   case 'open-person':openPerson(act.dataset.kind,act.dataset.index);break;
   case 'load-surah':loadSurah(Number(document.getElementById('surahSelect')?.value||state.surah));break;
   case 'prev-surah':if(state.surah>1){state.surah--;render();loadSurah(state.surah)}break;
   case 'next-surah':if(state.surah<114){state.surah++;render();loadSurah(state.surah)}break;
   case 'refresh-quran':refreshAll();break;
   case 'refresh-home':refreshAll();break;
   case 'load-hadith-online':loadOnlineHadith(true,state.hadithEdition||'tur-bukhari').then(()=>{if(state.page==='hadith')render()});break;
   case 'global-search':openGlobalSearch(document.getElementById('globalSearch')?.value||'');break;
   case 'quran-search':updateQuranSearch(document.getElementById('quranSearch')?.value||'');break;
   case 'hadith-search':doHadithFilter(document.getElementById('hadithSearch')?.value||'');break;
   case 'discover-search':state.page='discover';state.topic=null;state.q=(document.getElementById('topicSearch')?.value||'').trim();render();break;
   case 'select-sacred':selectSacred(Number(act.dataset.index));break;
   case 'select-sacred-by-name':selectSacred(sacredSelectionIndexByName(act.dataset.name));break;
   case 'reload-sacred':loadSacredReader();break;
   case 'random-sacred':{const d=sacredReaderDefs[state.sacredIndex];const max=d?.type==='turkish-bible'?(state.sacredBibleBooks?.[state.sacredBookIndex]?.[2]||bibleBookCatalog[state.sacredBookIndex]?.[2]||1):(d?.type==='sefaria'?(d.books?.[state.sacredBookIndex]?.[2]||50):(d?.chapterCount||26));state.sacredChapter=1+Math.floor(Math.random()*Math.max(1,max));refreshSacredSelectors();loadSacredReader();break;}
   case 'prev-sacred':{if(state.sacredChapter>1){state.sacredChapter--;refreshSacredSelectors();loadSacredReader()}break;}
   case 'next-sacred':{const d=sacredReaderDefs[state.sacredIndex];const max=d?.type==='turkish-bible'?(state.sacredBibleBooks?.[state.sacredBookIndex]?.[2]||bibleBookCatalog[state.sacredBookIndex]?.[2]||1):(d?.type==='sefaria'?(d.books?.[state.sacredBookIndex]?.[2]||50):(d?.chapterCount||26));if(state.sacredChapter<max){state.sacredChapter++;refreshSacredSelectors();loadSacredReader()}break;}
   case 'refresh-current':loadCurrentFeed(true);break;
   case 'open-current-item':{const it=(state.currentItems?.length?state.currentItems:currentFallback)[Number(act.dataset.index)];if(it)modal(`<div class="sheethero" style="background-image:url('${imageFor(it.img||'current',Number(act.dataset.index)+6)[1]}')"></div><div class="eyebrow2">GÜNCEL • ${esc(it.meta||'SEP')}</div><h3>${esc(it.title)}</h3><p class="meaning" style="color:#eef2ed">${esc(it.text||'')}</p><div class="ref">Kaynak: Stanford Encyclopedia of Philosophy</div>`);break;}
   case 'open-page':state.page=act.dataset.pageName||'home';state.topic=null;render();break;
  }
  return;
 }
 const searchHit=target.closest('[data-search-action]');
 if(searchHit){e.preventDefault();e.stopPropagation();const a=searchHit.dataset.searchAction||'';if(a.startsWith('topic:')){state.page='discover';state.topic=a.slice(6);state.q='';render()}else if(a.startsWith('person:')){const [,k,i]=a.split(':');openPerson(k,i)}else if(a.startsWith('hadith:'))openHadith(a.split(':')[1]);else if(a.startsWith('ayah:'))openAyah(a.slice(5));else if(a.startsWith('sacred:'))selectSacred(Number(a.split(':')[1]));return;}
 const sur=target.closest('[data-surah]'); if(sur){e.preventDefault();e.stopPropagation();state.page='quran';state.surah=Number(sur.dataset.surah);render();setTimeout(()=>loadSurah(state.surah),0);return;}
 const hb=target.closest('[data-hadith-book]'); if(hb){e.preventDefault();e.stopPropagation();state.hadithEdition=hb.dataset.hadithBook;loadOnlineHadith(true,state.hadithEdition).then(()=>{if(state.page==='hadith')render()});return;}
});
